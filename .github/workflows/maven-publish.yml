name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # Chú ý: Trỏ đúng vào file pom.xml trong thư mục của bạn
      run: mvn -B package --file BAI_TAP_TUAN_LTNC/BAI03-W9/pom.xml

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BankSystem-Jar-Package
        path: BAI_TAP_TUAN_LTNC/BAI03-W9/target/*.jar
